# Tranche-1 monolingual slice v1 (D28, roadmap A6). Builder: data/mix/build_mono_slice.py.
# Paths are inside diagrad:t1: ~/data/raw at /raw, ~/data/t1 at /t1.
seed: 20261018
sources:                              # order matters: earlier sources keep shared paragraphs
  - {name: finepdfs_fil, registry_id: hf-finepdfs-fil_Latn, whole: true,
     path: /raw/finepdfs-fil_Latn-220bac3/data/fil_Latn/train, columns: {text: text, id: id, url: url}}
  - {name: fineweb2_fil, registry_id: hf-fineweb-2-fil_Latn,
     path: /raw/fineweb2-fil_Latn-af9c133/data/fil_Latn/train, columns: {text: text, id: id, url: url}}
  - {name: hplt2_tgl, registry_id: hf-hplt2.0-cleaned-tgl_Latn,
     path: /raw/hplt2-cleaned-tgl_Latn-d1324a5/tgl_Latn, columns: {text: text, id: id, url: u}}
registry_dir: /repo/data/registry
lines_dir: /t1/mono-measure
madlad_lines: [madlad400_fil_clean.lines.npy, madlad400_fil_noisy.lines.npy, madlad400_fil_noisy1.lines.npy]
heldout:                              # D20 rule applied per paragraph; the same files the D20 check uses
  - /t1/heldout/test_smol.jsonl
  - /t1/heldout/dev_massive.jsonl
  - /t1/heldout/diag_massive_test.jsonl
pool_dir: /t1/mono/pool-v1
slice_dir: /t1/mono/slice-v1
token_budget: 500000000               # roadmap A6: about 0.5B MADLAD tokens
tokens_per_word: {finepdfs_fil: 1.6753, fineweb2_fil: 1.5270, hplt2_tgl: 1.6004}   # measure-mono-2026-10-17.json
max_segment_tokens: 127               # the collator keeps max_len - 1 = 127 tokens (src/diagrad/t1/data.py)
tokenizer: [google/madlad400-3b-mt, fa184c675da0b5c9e1c8694fccd4e12e2d422094]
workers: 16
